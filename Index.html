<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>THE BLOCK — Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214;
    --surface:#1B1B1F;
    --surface-2:#222227;
    --border:#2C2C32;
    --accent:#FF5024;
    --accent-dim:#5C2010;
    --gold:#F5B942;
    --gold-dim:#4A3714;
    --steel:#8C97A6;
    --text:#F3F1EC;
    --text-muted:#8D8D95;
    --success:#3ECF8E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:48px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.03em;}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  /* ---------- Masthead ---------- */
  header.masthead{
    margin:16px 14px 18px;
    padding:22px 20px;
    border-radius:16px;
    background:linear-gradient(150deg,#1E1E22 0%,#161618 100%);
    border:1px solid var(--border);
    position:relative;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  header.masthead .bolt{position:absolute;width:7px;height:7px;border-radius:50%;background:#3A3A42;box-shadow:inset 0 1px 1px rgba(0,0,0,0.6);}
  header.masthead .bolt.tl{top:10px;left:10px;} header.masthead .bolt.tr{top:10px;right:10px;}
  header.masthead .bolt.bl{bottom:10px;left:10px;} header.masthead .bolt.br{bottom:10px;right:10px;}
  header.masthead h1{
    font-size:44px;margin:0;color:var(--accent);line-height:0.9;
    text-shadow:0 2px 0 rgba(0,0,0,0.4);
  }
  header.masthead .sub{
    font-size:11px;letter-spacing:0.12em;color:var(--text-muted);
    text-transform:uppercase;margin-top:6px;
  }
  header.masthead .sub b{color:var(--gold);}

  /* ---------- Tabs ---------- */
  .tabrow{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;}
  .tabrow::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:9px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-muted);font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:600;letter-spacing:0.03em;cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#1A0A05;font-weight:700;}
  .tab.deload.active{background:var(--gold);border-color:var(--gold);}
  .sectionlabel{
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);
    padding:2px 14px 6px;margin-top:6px;
  }

  /* ---------- Session panel ---------- */
  .panel{margin:6px 14px 18px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .panel-head h2{font-size:19px;margin:0;font-weight:700;}
  .panel-meta{font-size:11px;color:var(--text-muted);margin-bottom:14px;}
  .panel-meta .rpe{color:var(--gold);}
  .complete-flag{font-size:11px;color:var(--success);font-weight:700;margin-left:8px;}

  .exercise{padding:12px 0;border-top:1px solid var(--border);}
  .exercise:first-child{border-top:none;}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ex-name{font-size:14.5px;font-weight:600;line-height:1.3;}
  .ex-tag{
    font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;padding:2px 6px;
    border-radius:5px;white-space:nowrap;margin-top:2px;display:inline-block;
  }
  .tag-priority{background:var(--gold-dim);color:var(--gold);}
  .tag-elevated{background:var(--accent-dim);color:var(--accent);}
  .tag-maintain{background:var(--surface-2);color:var(--steel);}
  .ex-meta{font-size:11px;color:var(--text-muted);margin-top:3px;}

  .discs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
  .disc{
    width:34px;height:34px;border-radius:50%;border:2px solid var(--border);
    background:var(--surface-2);color:var(--text-muted);font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s,border-color .12s,transform .08s;
  }
  .disc:active{transform:scale(0.92);}
  .disc:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .disc.done{
    background:linear-gradient(160deg,var(--accent),#C93D18);border-color:var(--accent);color:#1A0A05;
    box-shadow:0 2px 6px rgba(255,80,36,0.35);
  }
  .weight-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .weight-row label{font-size:11px;color:var(--text-muted);}
  .weight-row input{
    width:74px;padding:7px 8px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .weight-row input:focus-visible{outline:2px solid var(--accent);}
  .weight-row span{font-size:11px;color:var(--text-muted);}

  .loading{padding:24px 4px;color:var(--text-muted);font-size:13px;text-align:center;}

  /* ---------- Dashboard ---------- */
  .dash-head{padding:0 14px;margin-top:8px;}
  .dash-head h2{font-size:19px;margin:0 0 2px;}
  .dash-legend{font-size:10.5px;color:var(--text-muted);letter-spacing:0.02em;margin-bottom:10px;}
  .dash-legend .g{color:var(--gold);} .dash-legend .a{color:var(--accent);} .dash-legend .s{color:var(--steel);}

  .bar-row{padding:8px 0;}
  .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-top .m-name{font-weight:600;}
  .bar-top .m-count{font-family:'JetBrains Mono',monospace;color:var(--text-muted);}
  .bar-track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px;padding:2px;}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-seg{flex:1;min-width:3px;border-radius:2px;background:var(--border);}
  .bar-seg.filled.priority{background:var(--gold);}
  .bar-seg.filled.elevated{background:var(--accent);}
  .bar-seg.filled.maintain{background:var(--steel);}

  footer{text-align:center;font-size:10.5px;color:var(--text-muted);padding:20px 14px 4px;font-style:italic;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <span class="bolt tl"></span><span class="bolt tr"></span><span class="bolt bl"></span><span class="bolt br"></span>
    <h1 class="display">THE BLOCK</h1>
    <div class="sub">6-Week Hypertrophy Cycle · <b>Arms Priority</b></div>
  </header>

  <div class="sectionlabel">Week</div>
  <div class="tabrow" id="weekTabs"></div>

  <div class="sectionlabel">Day</div>
  <div class="tabrow" id="dayTabs"></div>
  <div class="tabrow" id="sessionTabs"></div>

  <div class="panel" id="sessionPanel"><div class="loading">Loading…</div></div>

  <div class="dash-head">
    <h2>Weekly Volume</h2>
    <div class="dash-legend"><span class="g">■</span> arms priority &nbsp; <span class="a">■</span> elevated (chest/shoulders/quads/calves) &nbsp; <span class="s">■</span> maintained</div>
  </div>
  <div class="panel" id="dashboard"><div class="loading">Loading…</div></div>

  <footer>logged sets stay on this device · tap a disc to mark a set done</footer>
</div>

<script>
(function(){

  const DAYS = {
    A: {
      label:"DAY A", name:"Chest / Shoulders / Back / Traps / Abs", sessions:2,
      exercises:[
        {id:"a_bench", name:"DB Bench Press", muscle:"Chest", reps:"8–10", sets:[3,3,4,4,4,2]},
        {id:"a_incline", name:"DB Incline Press", muscle:"Chest", reps:"10–12", sets:[3,3,3,3,3,2]},
        {id:"a_lateral", name:"DB Lateral Raise", muscle:"Shoulders", reps:"12–15", sets:[3,3,4,4,4,2]},
        {id:"a_reardelt", name:"DB Rear Delt Fly", muscle:"Shoulders", reps:"12–15", sets:[2,2,2,2,2,1]},
        {id:"a_frontraise", name:"DB Front Raise", muscle:"Shoulders", reps:"12–15", sets:[2,2,2,3,3,1]},
        {id:"a_row", name:"DB Chest-Supported Row", muscle:"Back", reps:"10–12", sets:[3,3,4,4,4,2]},
        {id:"a_pullover", name:"DB Pullover", muscle:"Back", reps:"12", sets:[2,2,2,3,3,1]},
        {id:"a_shrug", name:"DB Shrug", muscle:"Traps", reps:"15", sets:[2,2,2,2,2,1]},
        {id:"a_curl", name:"Incline DB Curl (accessory)", muscle:"Biceps", reps:"10–12", sets:[2,2,2,2,2,1]},
        {id:"a_tricep", name:"DB Overhead Tricep Ext, light (accessory)", muscle:"Triceps", reps:"12–15", sets:[2,2,2,2,2,1]},
        {id:"a_abs", name:"Weighted Crunch / Leg Raise", muscle:"Abs", reps:"15", sets:[2,2,2,2,2,1]}
      ]
    },
    B: {
      label:"DAY B", name:"Quads / Hamstrings / Calves / Forearms / Abs", sessions:2,
      exercises:[
        {id:"b_bss", name:"Bulgarian Split Squat", muscle:"Quads", reps:"10/side", sets:[3,3,4,4,4,2]},
        {id:"b_goblet", name:"DB Goblet Squat", muscle:"Quads", reps:"10–12", sets:[3,4,4,4,4,2]},
        {id:"b_rdl", name:"DB Romanian Deadlift", muscle:"Hamstrings", reps:"10–12", sets:[3,3,3,3,3,2]},
        {id:"b_slrdl", name:"Single-Leg RDL", muscle:"Hamstrings", reps:"10/side", sets:[2,2,2,2,2,1]},
        {id:"b_stcalf", name:"DB Standing Calf Raise", muscle:"Calves", reps:"15–20", sets:[4,4,5,5,5,2]},
        {id:"b_seatcalf", name:"DB Seated Calf Raise", muscle:"Calves", reps:"15–20", sets:[2,2,2,2,2,1]},
        {id:"b_hammer", name:"DB Hammer Curl (accessory)", muscle:"Biceps", reps:"10–12", sets:[2,2,2,2,2,1]},
        {id:"b_kickback", name:"DB Tricep Kickback (accessory)", muscle:"Triceps", reps:"12–15", sets:[2,2,2,2,2,1]},
        {id:"b_wrist", name:"DB Wrist Curl", muscle:"Forearms", reps:"15", sets:[2,2,2,2,2,1]},
        {id:"b_abs", name:"Weighted Crunch / Leg Raise", muscle:"Abs", reps:"15", sets:[2,2,2,2,2,1]}
      ]
    },
    ARM: {
      label:"ARM DAY", name:"Biceps / Triceps + Calf Top-Up", sessions:1,
      exercises:[
        {id:"arm_incline", name:"Incline DB Curl", muscle:"Biceps", reps:"10–12", sets:[3,4,4,4,4,2]},
        {id:"arm_curl", name:"DB Curl (standing)", muscle:"Biceps", reps:"10–12", sets:[3,3,4,4,4,2]},
        {id:"arm_cross", name:"Cross-Body Hammer Curl", muscle:"Biceps", reps:"12–15", sets:[2,2,2,2,2,1]},
        {id:"arm_skull", name:"Flat DB Skull Crusher", muscle:"Triceps", reps:"12–15", sets:[3,4,4,4,4,2]},
        {id:"arm_ohtricep", name:"DB Overhead Tricep Ext, light", muscle:"Triceps", reps:"15", sets:[2,2,2,3,3,1]},
        {id:"arm_cgp", name:"DB Close-Grip / JM Press", muscle:"Triceps", reps:"10–12", sets:[2,2,3,3,3,1]},
        {id:"arm_calf", name:"DB Standing Calf Raise (top-up)", muscle:"Calves", reps:"15–20", sets:[3,3,4,4,4,2]}
      ]
    }
  };

  const MUSCLE_ORDER = ["Biceps","Triceps","Chest","Shoulders","Quads","Calves","Back","Hamstrings","Traps","Forearms","Abs"];
  const TIER = {
    Biceps:"priority", Triceps:"priority",
    Chest:"elevated", Shoulders:"elevated", Quads:"elevated", Calves:"elevated",
    Back:"maintain", Hamstrings:"maintain", Traps:"maintain", Forearms:"maintain", Abs:"maintain"
  };
  const RPE_LABEL = ["7 · 2 reps in reserve","7 · 2 reps in reserve","8 · 1 rep in reserve","8 · 1 rep in reserve","8–9 · peak, last set to failure","5–6 · deload"];
  const DAY_ORDER = ["A","B","ARM"];

  let state = { week:1, day:"A", session:1 };
  let progress = {};

  function tagClass(muscle){ return "tag-" + TIER[muscle]; }

  // ---------- storage helpers ----------
  async function loadSettings(){
    try{
      const res = await window.storage.get("settings", false);
      if(res && res.value){ const s = JSON.parse(res.value); state = Object.assign(state, s); }
    }catch(e){ /* no settings yet */ }
  }
  async function saveSettings(){
    try{ await window.storage.set("settings", JSON.stringify(state), false); }
    catch(e){ console.error("settings save failed", e); }
  }
  function sessionKey(day, session, week){
    return "log_w" + (week!==undefined?week:state.week) + "_" + (day||state.day) + "_" + (session!==undefined?session:state.session);
  }
  async function loadProgress(day, session, week){
    try{
      const res = await window.storage.get(sessionKey(day, session, week), false);
      return (res && res.value) ? JSON.parse(res.value) : {};
    }catch(e){ return {}; }
  }
  async function persistProgress(){
    try{ await window.storage.set(sessionKey(), JSON.stringify(progress), false); }
    catch(e){ console.error("progress save failed", e); }
  }

  // ---------- targets / completed ----------
  function getTargets(week){
    const idx = week-1;
    const totals = {}; MUSCLE_ORDER.forEach(m=>totals[m]=0);
    Object.values(DAYS).forEach(day=>{
      day.exercises.forEach(ex=>{ totals[ex.muscle] += ex.sets[idx]*day.sessions; });
    });
    return totals;
  }
  async function getCompleted(week){
    const totals = {}; MUSCLE_ORDER.forEach(m=>totals[m]=0);
    const combos = [["A",1],["A",2],["B",1],["B",2],["ARM",1]];
    for(const [day,session] of combos){
      const p = await loadProgress(day, session, week);
      DAYS[day].exercises.forEach(ex=>{
        const rec = p[ex.id];
        if(rec && Array.isArray(rec.sets)) totals[ex.muscle] += rec.sets.filter(Boolean).length;
      });
    }
    return totals;
  }

  // ---------- render: tabs ----------
  function renderWeekTabs(){
    const el = document.getElementById("weekTabs");
    el.innerHTML = "";
    for(let w=1; w<=6; w++){
      const b = document.createElement("button");
      b.className = "tab mono" + (w===state.week?" active":"") + (w===6?" deload":"");
      b.textContent = w===6 ? "W6 · DELOAD" : "W"+w;
      b.onclick = () => { state.week = w; saveSettings(); renderSession(); renderDashboard(); renderWeekTabs(); };
      el.appendChild(b);
    }
  }
  function renderDayTabs(){
    const el = document.getElementById("dayTabs");
    el.innerHTML = "";
    DAY_ORDER.forEach(d=>{
      const b = document.createElement("button");
      b.className = "tab mono" + (d===state.day?" active":"");
      b.textContent = DAYS[d].label;
      b.onclick = () => { state.day = d; state.session = 1; saveSettings(); renderSession(); renderDayTabs(); renderSessionTabs(); };
      el.appendChild(b);
    });
    renderSessionTabs();
  }
  function renderSessionTabs(){
    const el = document.getElementById("sessionTabs");
    el.innerHTML = "";
    if(DAYS[state.day].sessions < 2){ el.style.display="none"; return; }
    el.style.display = "flex";
    [1,2].forEach(s=>{
      const b = document.createElement("button");
      b.className = "tab mono" + (s===state.session?" active":"");
      b.textContent = "SESSION " + s;
      b.onclick = () => { state.session = s; saveSettings(); renderSession(); renderSessionTabs(); };
      el.appendChild(b);
    });
  }

  // ---------- render: session panel ----------
  async function renderSession(){
    const panel = document.getElementById("sessionPanel");
    panel.innerHTML = '<div class="loading">Loading…</div>';
    progress = await loadProgress();
    const dayDef = DAYS[state.day];
    const idx = state.week - 1;

    let allDone = true;
    const cards = dayDef.exercises.map(ex=>{
      const target = ex.sets[idx];
      if(!progress[ex.id] || !Array.isArray(progress[ex.id].sets)){
        progress[ex.id] = { sets: new Array(target).fill(false), weight: null };
      } else if(progress[ex.id].sets.length !== target){
        const old = progress[ex.id].sets;
        progress[ex.id].sets = new Array(target).fill(false).map((_,i)=> !!old[i]);
      }
      const rec = progress[ex.id];
      if(rec.sets.filter(Boolean).length < target) allDone = false;

      const discs = rec.sets.map((done,i)=>
        '<button class="disc' + (done?' done':'') + '" data-ex="'+ex.id+'" data-i="'+i+'" aria-label="Set '+(i+1)+(done?' completed':' not completed')+'">' + (i+1) + '</button>'
      ).join("");

      return '<div class="exercise">' +
        '<div class="ex-top"><div class="ex-name">'+ex.name+'</div>' +
          '<span class="ex-tag '+tagClass(ex.muscle)+'">'+ex.muscle+'</span></div>' +
        '<div class="ex-meta">'+target+' sets · '+ex.reps+' reps</div>' +
        '<div class="discs">'+discs+'</div>' +
        '<div class="weight-row"><label for="w_'+ex.id+'">Weight</label>' +
          '<input type="number" step="0.5" min="0" id="w_'+ex.id+'" data-ex="'+ex.id+'" value="'+(rec.weight!==null&&rec.weight!==undefined?rec.weight:'')+'" placeholder="0" />' +
          '<span>kg</span></div>' +
      '</div>';
    }).join("");

    panel.innerHTML =
      '<div class="panel-head"><h2>'+dayDef.label+(DAYS[state.day].sessions>1?' · S'+state.session:'')+'</h2>' +
        (allDone ? '<span class="complete-flag">✓ SESSION COMPLETE</span>' : '') +
      '</div>' +
      '<div class="panel-meta">'+dayDef.name+' &nbsp;·&nbsp; RPE <span class="rpe">'+RPE_LABEL[idx]+'</span></div>' +
      cards;

    panel.querySelectorAll(".disc").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const exId = btn.getAttribute("data-ex");
        const i = parseInt(btn.getAttribute("data-i"),10);
        progress[exId].sets[i] = !progress[exId].sets[i];
        btn.classList.toggle("done", progress[exId].sets[i]);
        await persistProgress();
        renderDashboard();
        checkAllDone();
      });
    });
    panel.querySelectorAll("input[type=number]").forEach(inp=>{
      inp.addEventListener("change", async ()=>{
        const exId = inp.getAttribute("data-ex");
        const v = parseFloat(inp.value);
        progress[exId].weight = isNaN(v) ? null : v;
        await persistProgress();
      });
    });

    function checkAllDone(){
      let done = true;
      dayDef.exercises.forEach(ex=>{
        const target = ex.sets[idx];
        if(progress[ex.id].sets.filter(Boolean).length < target) done = false;
      });
      const flag = panel.querySelector(".complete-flag");
      const head = panel.querySelector(".panel-head");
      if(done && !flag){
        const span = document.createElement("span");
        span.className = "complete-flag"; span.textContent = "✓ SESSION COMPLETE";
        head.appendChild(span);
      } else if(!done && flag){
        flag.remove();
      }
    }
  }

  // ---------- render: dashboard ----------
  async function renderDashboard(){
    const el = document.getElementById("dashboard");
    el.innerHTML = '<div class="loading">Loading…</div>';
    const targets = getTargets(state.week);
    const completed = await getCompleted(state.week);

    el.innerHTML = MUSCLE_ORDER.map(m=>{
      const target = targets[m] || 0;
      const done = completed[m] || 0;
      const tier = TIER[m];
      const segCount = target > 0 ? target : 1;
      let segs = "";
      for(let i=0;i<segCount;i++){
        segs += '<div class="bar-seg' + (i < done ? (' filled '+tier) : '') + '"></div>';
      }
      return '<div class="bar-row">' +
        '<div class="bar-top"><span class="m-name">'+m+'</span><span class="m-count mono">'+done+' / '+target+'</span></div>' +
        '<div class="bar-track">'+segs+'</div>' +
      '</div>';
    }).join("");
  }

  // ---------- init ----------
  async function init(){
    await loadSettings();
    renderWeekTabs();
    renderDayTabs();
    await renderSession();
    await renderDashboard();
  }
  init();

})();
</script>
</body>
</html>
