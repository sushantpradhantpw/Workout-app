<style>
  :root{
    --bg:#FFFFFF; --surface:#F7F8F2; --surfaceAlt:#ECEEE3; --border:#E1E1D6;
    --text:#181920; --textMuted:#6C6F76; --textFaint:#A4A7AC;
    --heavy:#FF4B3E; --light:#12B3A6; --success:#2FAE60; --danger:#E23F55; --sun:#FFC53D; --onAccent:#FFFFFF;
    --font-display:"Trebuchet MS","Century Gothic",Futura,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:var(--font-body);color:var(--text);-webkit-tap-highlight-color:transparent;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .screen{padding:0 max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));flex:1;overflow-y:auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));}
  .topbar-left{display:flex;align-items:center;gap:6px;}
  .topbar h1{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-0.3px;color:var(--text);margin:0;}
  .back-btn{background:transparent;border:none;color:var(--text);cursor:pointer;padding:4px;margin-left:-8px;display:flex;}
  .bottom-nav{position:sticky;bottom:0;display:flex;border-top:1px solid var(--border);background:var(--bg);padding:6px 0 calc(6px + env(safe-area-inset-bottom));}
  .nav-item{flex:1;background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;font-family:var(--font-body);}
  .nav-item svg{display:block;}
  .card{background:var(--surface);border-radius:16px;padding:16px;}
  .btn{font-family:var(--font-display);font-weight:700;font-size:15px;padding:13px 18px;border-radius:14px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s ease;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn.full{width:100%;}
  .btn.ghost{background:var(--surfaceAlt);color:var(--text);}
  .field{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;width:100%;font-family:var(--font-body);}
  textarea.field{resize:none;}
  select.field{-webkit-appearance:none;appearance:none;}
  a{color:inherit;}
  ::placeholder{color:var(--textFaint);}
</style>
</head>

<script>

const REST_DEFAULT = { heavy: 180, light: 90 };

/* ================================================================ */
/* Storage (localStorage — synchronous, works fully offline)         */
/* ================================================================ */

function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v != null ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
function clearKey(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

/* ================================================================ */
/* Date / formatting helpers                                         */
/* ================================================================ */

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function formatDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayStr() { return formatDate(new Date()); }
function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function niceDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function shortDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function formatElapsed(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if (h > 0) return `${h}:${pad(m)}:${pad(s)}`;
  return `${m}:${pad(s)}`;
}
function weeksBetween(d1, d2) {
  return Math.round((d2 - d1) / (7 * 24 * 3600 * 1000));
}
function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

    history: `<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 5v4h4"/><path d="M12 8v4l3 3"/>`,

/* ================================================================ */
/* Tiny inline SVG line chart (replacement for a charting library)   */
/* ================================================================ */

function lineChart(points, color) {
  // points: [{label, value}], at least 2 for a meaningful line
  const w = 320, h = 160, padL = 34, padR = 10, padT = 12, padB = 22;
  const vals = points.map((p) => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const xStep = points.length > 1 ? (w - padL - padR) / (points.length - 1) : 0;
  const xy = points.map((p, i) => {
    const x = padL + i * xStep;
    const y = padT + (h - padT - padB) * (1 - (p.value - min) / span);
    return [x, y];
  });
  const linePath = xy.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + (h - padT - padB) * f;
    const val = (max - span * f);
    return `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="3,3"/>
      <text x="2" y="${y + 4}" font-size="10" fill="var(--textFaint)">${Math.round(val)}</text>`;
  }).join("");
  const labels = xy.map((p, i) => {
    if (points.length > 6 && i % Math.ceil(points.length / 6) !== 0 && i !== points.length - 1) return "";
    return `<text x="${p[0]}" y="${h - 4}" font-size="10" fill="var(--textFaint)" text-anchor="middle">${esc(points[i].label)}</text>`;
  }).join("");
  const dots = xy.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
    ${gridLines}
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

/* ================================================================ */

function ensureAudio() {

}

  try {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [0, 0.32].forEach((offset) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + offset); osc.stop(now + offset + 0.3);
    });
  } catch (e) { /* noop */ }

    const label = isSessionRunning(S.draft) ? "Session in progress" : "Session paused";
    html += cardHtml(
      `<div style="color:var(--textMuted);font-size:12px;margin-bottom:4px;">${label}</div>
       <div style="color:var(--text);font-weight:700;font-size:16px;">${DAY_LABEL[S.draft.day]} · ${S.draft.intensity === "heavy" ? "Heavy" : "Light"} · <span id="home-elapsed-value">${formatElapsed(computeActiveSeconds(S.draft, Date.now()))}</span> so far — tap to continue</div>`,
      { accent: color, extraStyle: "margin-bottom:16px;", action: "resumeDraftView" }
    );
  }

  html += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
    <div>
      <div style="font-size:12px;color:var(--textMuted);">${stats ? `Week ${stats.currentWeekNumber}` : "This week"}</div>
      <div style="font-family:var(--font-display);font-size:34px;font-weight:900;color:var(--text);line-height:1;">
        ${stats ? stats.liveCount : wc}<span style="font-size:18px;color:var(--textMuted);font-weight:700;"> / ${stats ? stats.target : 4} sessions</span>
      </div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:12px;color:var(--textMuted);">Suggested next</div>
      <div style="font-weight:800;color:var(--text);font-size:16px;">${DAY_LABEL[suggested]}</div>
    </div>
  </div>`;

  if (stats) {
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:12px;color:${stats.streak > 0 ? "var(--success)" : "var(--textFaint)"};">${stats.streak > 0 ? `${stats.streak} week streak at target` : "Streak reset — hit target this week to start a new one"}</div>
      <button type="button" data-action="consistencyEditExisting" style="background:none;border:none;color:var(--textFaint);font-size:12px;cursor:pointer;text-decoration:underline;">Edit</button>
    </div>`;
  }
  if (!S.consistency && !S.consistencyEditing) {
    html += `<button type="button" data-action="consistencyStartEdit" style="background:none;border:none;color:var(--textFaint);font-size:12px;cursor:pointer;text-decoration:underline;display:block;margin-bottom:20px;">Set up consistency tracking</button>`;
  }
  if (S.consistencyEditing) {
    html += cardHtml(
      `<div style="font-size:13px;color:var(--textMuted);margin-bottom:6px;">Which week are you on?</div>
       ${fieldHtml({ type: "number", bind: "consistencyWeekInput", value: S.consistencyWeekInput, placeholder: "e.g. 6", extraStyle: "margin-bottom:12px;" })}
       <div style="font-size:13px;color:var(--textMuted);margin-bottom:6px;">Target sessions per week</div>
       ${fieldHtml({ type: "number", bind: "consistencyTargetInput", value: S.consistencyTargetInput, extraStyle: "margin-bottom:14px;" })}
       <div style="font-size:11px;color:var(--textFaint);margin-bottom:14px;">Weeks before this one are taken as consistent on your word. From this week on, the streak is checked against sessions you actually log.</div>
       <div style="display:flex;gap:8px;">
         ${btnHtml("Cancel", { variant: "outline", color: "var(--textMuted)", action: "consistencyCancelEdit" })}
         ${btnHtml("Save", { full: true, color: "var(--heavy)", action: "saveConsistency" })}
       </div>`,
      { extraStyle: "margin-bottom:20px;" }
    );
  }

  html += `<button type="button" data-action="openQuickAdd" style="display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;color:var(--textMuted);font-size:13px;cursor:pointer;margin-bottom:20px;">
    ${icon("messageSquarePlus", { size: 16 })} Forgot to log something? Add it here
  </button>`;

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Choose today's day</div>
  <div style="display:flex;gap:10px;margin-bottom:20px;">
    ${["A", "B"].map((d) => {
      const active = S.pendingDay === d;
      return `<div data-action="setPendingDay" data-arg="${d}" style="flex:1;background:${active ? "var(--surfaceAlt)" : "var(--surface)"};border:1.5px solid ${active ? "var(--text)" : "var(--border)"};border-radius:16px;padding:14px;cursor:pointer;">
        <div style="font-weight:800;font-size:16px;color:var(--text);">${DAY_LABEL[d]}</div>
        <div style="font-size:12px;color:var(--textMuted);margin-top:4px;">${DAY_MUSCLE_SUMMARY[d]}</div>
      </div>`;
    }).join("")}
  </div>`;

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Choose intensity</div>
  <div style="display:flex;gap:10px;margin-bottom:24px;">
    ${[{ id: "heavy", label: "Heavy", sub: "RPE ~9 · 3:00 rest", color: "var(--heavy)" }, { id: "light", label: "Light", sub: "RPE 6–7 · 1:30 rest", color: "var(--light)" }].map((it) => {
      const active = S.pendingIntensity === it.id;
      return `<div data-action="setPendingIntensity" data-arg="${it.id}" style="flex:1;background:${active ? it.color : "var(--surface)"};border:1.5px solid ${active ? it.color : "var(--border)"};border-radius:16px;padding:14px;cursor:pointer;">
        <div style="font-weight:800;font-size:16px;color:${active ? "var(--onAccent)" : "var(--text)"};">${it.label}</div>
        <div style="font-size:12px;color:${active ? "var(--onAccent)" : "var(--textMuted)"};margin-top:4px;">${it.sub}</div>
      </div>`;
    }).join("")}
  </div>`;

  if (S.pendingDay && S.pendingIntensity) {
    html += `<div style="margin-bottom:20px;">
      <div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Target sets today</div>
      ${cardHtml(
        `${MUSCLE_CONFIG[S.pendingDay].map((m, i) => `<div style="display:flex;justify-content:space-between;padding:6px 0;${i === 0 ? "" : "border-top:1px solid var(--border);"}">
          <span style="color:var(--text);font-size:14px;">${m.name}</span>
          <span style="color:var(--textMuted);font-size:14px;font-weight:700;">${m[S.pendingIntensity]} sets</span>
        </div>`).join("")}
        <div style="font-size:11px;color:var(--textFaint);margin-top:8px;">Targets adjust live during the session based on the RPE you log per set.</div>`
      )}
    </div>`;
  }

  html += btnHtml(S.draft ? "Finish current session first" : "Start session", {
    full: true, disabled: !S.pendingDay || !S.pendingIntensity || !!S.draft,
    color: S.pendingIntensity === "light" ? "var(--light)" : "var(--heavy)", action: "beginSession",
  });

  return html;
}

/* ================================================================ */
/* Screen: Quick add                                                  */
/* ================================================================ */

function renderQuickAdd() {
  let html = `<div style="color:var(--textMuted);font-size:13px;margin-bottom:16px;">Backfill a session, a weigh-in, or just leave yourself a note.</div>`;
  html += `<div style="display:flex;gap:8px;margin-bottom:16px;">
    ${[{ id: "session", label: "Session" }, { id: "bodyweight", label: "Body weight" }, { id: "note", label: "Note" }]
      .map((t) => pillHtml(t.label, { active: S.quickAddType === t.id, action: "setQuickAddType", arg: t.id }))
      .join("")}
  </div>`;
  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:6px;">Date</div>
    ${fieldHtml({ type: "date", bind: "quickAddDate", value: S.quickAddDate, extraStyle: "margin-bottom:16px;" })}`;

  if (S.quickAddType === "session") {
    html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:6px;">Day</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        ${["A", "B"].map((d) => pillHtml(DAY_LABEL[d], { active: S.quickAddDay === d, action: "setQuickAddDay", arg: d })).join("")}
      </div>
      <div style="color:var(--textMuted);font-size:13px;margin-bottom:6px;">Intensity</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        ${[{ id: "heavy", label: "Heavy" }, { id: "light", label: "Light" }].map((it) => pillHtml(it.label, { active: S.quickAddIntensity === it.id, action: "setQuickAddIntensity", arg: it.id })).join("")}
      </div>`;
  }
  if (S.quickAddType === "bodyweight") {
    html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:6px;">Weight (kg)</div>
      ${fieldHtml({ type: "number", bind: "quickAddWeight", value: S.quickAddWeight, extraStyle: "margin-bottom:16px;" })}`;
  }
  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:6px;">Note</div>
    ${textareaHtml({ bind: "quickAddNote", value: S.quickAddNote, rows: 3, extraStyle: "margin-bottom:20px;" })}`;
  html += `<div style="display:flex;gap:10px;">
    ${btnHtml("Cancel", { variant: "outline", color: "var(--textMuted)", action: "cancelQuickAdd" })}
    ${btnHtml("Save", { full: true, color: "var(--heavy)", action: "saveQuickAdd" })}
  </div>`;
  return html;
}

/* ================================================================ */
/* Screen: Session — muscle list                                      */
/* ================================================================ */

function renderMuscleList() {
  const muscles = MUSCLE_CONFIG[S.draft.day];
  const targets = muscles.map((m) => adjustedMuscleTarget(m.key));
  const totalTarget = targets.reduce((a, t) => a + t.target, 0);
  const totalLogged = muscles.reduce((a, m) => a + muscleSetsLogged(m.key), 0);
  const color = S.draft.intensity === "heavy" ? "var(--heavy)" : "var(--light)";
  const elapsed = computeActiveSeconds(S.draft, Date.now());
  const running = isSessionRunning(S.draft);

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="background:${color};color:var(--onAccent);font-weight:800;font-size:12px;padding:4px 10px;border-radius:20px;">${S.draft.intensity === "heavy" ? "Heavy" : "Light"}</span>
      <span style="color:var(--textMuted);font-size:13px;">${niceDate(S.draft.date)} · ${totalLogged}/${totalTarget} sets</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="session-elapsed-value" style="font-family:var(--font-display);font-weight:800;font-size:15px;color:${running ? "var(--text)" : "var(--textFaint)"};">${formatElapsed(elapsed)}</span>
      <button type="button" data-action="toggleSessionTimer" style="background:var(--surfaceAlt);border:none;border-radius:8px;padding:6px;cursor:pointer;display:flex;">
        ${running ? icon("pause", { size: 14 }) : icon("play", { size: 14, color: "var(--text)" })}
      </button>
    </div>
  </div>`;
  if (!running) {
    html += `<div style="font-size:12px;color:var(--textFaint);margin-bottom:12px;">Paused — resume when you're back for the rest of this workout.</div>`;
  }
  html += `<div style="margin-bottom:${running ? 16 : 4}px;"></div>`;

  html += `<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
    ${muscles.map((m, idx) => {
      const logged = muscleSetsLogged(m.key);
      const { target, adjusted, baseline } = targets[idx];
      const done = logged >= target;
      return cardHtml(
        `<div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:16px;color:var(--text);">${m.name}</div>
            <div style="font-size:13px;color:var(--textMuted);margin-top:2px;">${logged} of ${target} sets${adjusted ? `<span style="color:var(--textFaint);"> (was ${baseline}, RPE-adjusted)</span>` : ""}</div>
          </div>
          ${done ? icon("check", { size: 20, color: "var(--success)" }) : ""}
        </div>`,
        { accent: done ? "var(--success)" : color, action: "openMuscle", arg: m.key, extraStyle: done ? "background:#EAF7EE;" : "" }
      );
    }).join("")}
  </div>`;

  html += `<div style="display:flex;gap:10px;">
    ${btnHtml("Discard", { variant: "outline", color: "var(--danger)", action: "discardDraft" })}
    ${btnHtml("Finish session", { full: true, color, action: "goToFinish" })}
  </div>`;
  return html;
}

/* ================================================================ */
/* Screen: Session — exercise list                                    */
/* ================================================================ */

function renderExerciseList() {
  const { target, adjusted, baseline } = adjustedMuscleTarget(S.activeMuscle);
  const frequent = frequentExercisesFor(S.activeMuscle);
  const fullCatalog = [
    ...(EXERCISE_DB[S.activeMuscle] || []),
    ...((S.customExercises[S.activeMuscle] || []).filter((n) => !(EXERCISE_DB[S.activeMuscle] || []).includes(n))),
  ];
  const rest = fullCatalog.filter((n) => !frequent.includes(n));
  const doneEntries = S.draft.entries.map((e, idx) => ({ ...e, idx })).filter((e) => e.muscle === S.activeMuscle);
  const logged = muscleSetsLogged(S.activeMuscle);
  const remaining = Math.max(0, target - logged);
  const intensityColor = S.draft.intensity === "heavy" ? "var(--heavy)" : "var(--light)";

  let html = cardHtml(
    `<div style="font-family:var(--font-display);font-weight:900;font-size:28px;color:var(--text);line-height:1;">${remaining === 0 ? "Target hit" : `${remaining} set${remaining !== 1 ? "s" : ""} left`}</div>
     <div style="font-size:12px;color:var(--textMuted);margin-top:4px;">${logged} of ${target} sets${adjusted ? ` (was ${baseline}, RPE-adjusted)` : ""}</div>`,
    { accent: remaining === 0 ? "var(--success)" : intensityColor, extraStyle: "margin-bottom:16px;text-align:center;" }
  );

  if (doneEntries.length > 0) {
    html += `<div style="margin-bottom:20px;">
      <div style="color:var(--textMuted);font-size:13px;margin:12px 0 8px;">Added this session</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${doneEntries.map((e) => cardHtml(
          `<div style="display:flex;justify-content:space-between;">
            <span style="color:var(--text);font-weight:600;">${esc(e.exercise)}</span>
            <span style="color:var(--textMuted);font-size:13px;">${e.sets.length} set${e.sets.length !== 1 ? "s" : ""}</span>
          </div>`,
          { action: "continueEntry", arg: e.idx }
        )).join("")}
      </div>
    </div>`;
  }
  if (frequent.length > 0) {
    html += `<div style="margin-bottom:20px;">
      <div style="color:var(--textMuted);font-size:13px;margin:4px 0 8px;">Frequently used</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${frequent.map((name) => cardHtml(
          `<div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="color:var(--text);">${esc(name)}</span>${icon("plus", { size: 16, color: "var(--textMuted)" })}
          </div>`,
          { accent: "var(--success)", action: "addExerciseEntry", arg: name }
        )).join("")}
      </div>
    </div>`;
  }
  html += `<div style="color:var(--textMuted);font-size:13px;margin:4px 0 8px;">All exercises</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
      ${rest.map((name) => cardHtml(
        `<div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:var(--text);">${esc(name)}</span>${icon("plus", { size: 16, color: "var(--textMuted)" })}
        </div>`,
        { action: "addExerciseEntry", arg: name }
      )).join("")}
    </div>`;

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Or add your own</div>
    <div style="display:flex;gap:8px;">
      ${fieldHtml({ bind: "customInput", value: S.customInput, placeholder: "Exercise name" })}
      ${btnHtml("Add", { variant: "ghost", action: "addCustomExercise" })}
    </div>`;
  return html;
}

/* ================================================================ */
/* Screen: Session — logging                                          */
/* ================================================================ */

function renderLogging() {
  const entry = S.draft.entries[S.activeEntryIdx];
  const last = lastTimeFor(entry.exercise);
  const bestPrev = bestPreviousTop(entry.exercise);
  const color = S.draft.intensity === "heavy" ? "var(--heavy)" : "var(--light)";
  const { target, adjusted, baseline } = adjustedMuscleTarget(entry.muscle);
  const muscleName = (MUSCLE_CONFIG[S.draft.day].find((m) => m.key === entry.muscle) || {}).name || "";
  const loggedForMuscle = muscleSetsLogged(entry.muscle);
  const remainingForMuscle = Math.max(0, target - loggedForMuscle);

  let html = cardHtml(
    `<div style="font-family:var(--font-display);font-weight:900;font-size:24px;color:var(--text);line-height:1;">${remainingForMuscle === 0 ? `${esc(muscleName)} target hit` : `${remainingForMuscle} set${remainingForMuscle !== 1 ? "s" : ""} left for ${esc(muscleName)}`}</div>
     ${adjusted ? `<div style="font-size:11px;color:var(--textFaint);margin-top:4px;">Adjusted from ${baseline} based on the RPE you've logged</div>` : ""}`,
    { accent: remainingForMuscle === 0 ? "var(--success)" : color, extraStyle: "margin-bottom:16px;text-align:center;" }
  );

  html += `<h2 style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text);margin:0 0 4px;">${esc(entry.exercise)}</h2>
    <div style="font-size:13px;color:var(--textMuted);margin-bottom:16px;">
      ${last ? `Last time (${shortDate(last.date)}): ${esc(last.sets.map((s) => `${s.weight}kg×${s.reps}${s.rpe ? ` @${s.rpe}` : ""}`).join(", "))}` : "No history yet for this exercise"}
    </div>`;

  if (entry.sets.length > 0) {
    html += `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
      ${entry.sets.map((s, i) => {
        const trulyPR = bestPrev > 0 && s.weight > bestPrev;
        return `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:8px;padding:8px 12px;">
          <span style="color:var(--text);font-size:14px;">Set ${i + 1}: <strong>${s.weight}kg</strong> × ${s.reps}${s.rpe ? ` @ RPE ${s.rpe}` : ""}
          ${trulyPR ? `<span style="margin-left:8px;background:var(--sun);color:var(--text);font-weight:800;font-size:10px;padding:2px 6px;border-radius:8px;">PR</span>` : ""}</span>
          <button type="button" data-action="removeSet" data-arg="${i}" style="background:none;border:none;cursor:pointer;">${icon("x", { size: 16, color: "var(--textFaint)" })}</button>
        </div>`;
      }).join("")}
    </div>`;
  }

  const lastSet = last ? last.sets[last.sets.length - 1] : null;
  html += `<div style="display:flex;gap:8px;margin-bottom:8px;">
    ${fieldHtml({ type: "number", bind: "weightInput", value: S.weightInput, placeholder: lastSet ? `${lastSet.weight}` : "kg", extraStyle: "flex:1;" })}
    ${fieldHtml({ type: "number", bind: "repsInput", value: S.repsInput, placeholder: lastSet ? `${lastSet.reps}` : "reps", extraStyle: "flex:1;" })}
  </div>
  <div style="margin-bottom:12px;">
    <select class="field" data-bind="rpeInput">
      <option value="" ${S.rpeInput === "" ? "selected" : ""}>RPE (optional)</option>
      ${RPE_OPTIONS.map((r) => `<option value="${r}" ${String(S.rpeInput) === String(r) ? "selected" : ""}>RPE ${r}</option>`).join("")}
    </select>
  </div>
  ${btnHtml(`${icon("plus", { size: 16 })} Add set`, { full: true, color, action: "addSet", extraStyle: "margin-bottom:20px;" })}`;

  if (S.timerDisplay > 0 || S.timerRunning) {
    html += cardHtml(
      `<div style="font-size:12px;color:var(--textMuted);margin-bottom:4px;">${S.timerDisplay === 0 ? "Rest complete" : "Rest timer"}</div>
       <div id="rest-timer-value" style="font-family:var(--font-display);font-weight:900;font-size:40px;color:${S.timerDisplay === 0 ? "var(--success)" : "var(--text)"};line-height:1;">${Math.floor(S.timerDisplay / 60)}:${pad(S.timerDisplay % 60)}</div>
       <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
         ${btnHtml("−15s", { variant: "ghost", action: "adjustRestTimer", arg: "-15" })}
         ${btnHtml(S.timerRunning ? icon("pause", { size: 16 }) : icon("play", { size: 16 }), { variant: "ghost", action: "toggleRestTimer" })}
         ${btnHtml("+15s", { variant: "ghost", action: "adjustRestTimer", arg: "15" })}
         ${btnHtml(icon("rotateCcw", { size: 16 }), { variant: "ghost", action: "resetRestTimer" })}
       </div>`,
      { extraStyle: "margin-bottom:20px;text-align:center;" }
    );
  }

  html += btnHtml("Done with this exercise", { full: true, variant: "outline", color: "var(--textMuted)", action: "doneWithExercise" });
  return html;
}

/* ================================================================ */
/* Screen: Finish                                                     */
/* ================================================================ */

function renderFinish() {
  const color = S.draft.intensity === "heavy" ? "var(--heavy)" : "var(--light)";
  let html = cardHtml(
    `<div style="font-size:12px;color:var(--textMuted);margin-bottom:10px;text-align:center;">Active training time — adjust if it doesn't look right</div>
     <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
       ${fieldHtml({ type: "number", bind: "finishHours", value: S.finishHours, extraStyle: "width:64px;text-align:center;font-family:var(--font-display);font-weight:900;font-size:28px;" })}
       <span style="color:var(--textMuted);font-size:13px;">hr</span>
       ${fieldHtml({ type: "number", bind: "finishMinutes", value: S.finishMinutes, extraStyle: "width:64px;text-align:center;font-family:var(--font-display);font-weight:900;font-size:28px;" })}
       <span style="color:var(--textMuted);font-size:13px;">min</span>
     </div>`,
    { extraStyle: "margin-bottom:20px;" }
  );

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Personal records</div>`;
  if (S.finishPRs.length === 0) {
    html += `<div style="color:var(--textFaint);font-size:14px;margin-bottom:20px;">No new PRs this session — that's fine, consistency is the win.</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
      ${S.finishPRs.map((pr) => cardHtml(
        `<div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:var(--text);font-weight:700;">${esc(pr.exercise)}</span>
          <span style="color:var(--text);background:var(--sun);font-weight:800;padding:2px 10px;border-radius:10px;font-size:13px;">${pr.weight}kg PR</span>
        </div>`,
        { accent: "var(--sun)" }
      )).join("")}
    </div>`;
  }

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:6px;">Reflections (optional)</div>
    ${textareaHtml({ bind: "reflectionInput", value: S.reflectionInput, placeholder: "How did it feel? Anything to remember for next time?", rows: 4, extraStyle: "margin-bottom:20px;" })}
    ${btnHtml("Save & finish", { full: true, color, action: "commitSession" })}`;
  return html;
}

/* ================================================================ */
/* Screen: History                                                    */
/* ================================================================ */

function renderHistory() {
  const sorted = [...S.sessions].sort((a, b) => (a.date < b.date ? 1 : -1));
  const names = allExerciseNames();
  const chartData = S.chartExercise
    ? sorted
        .filter((s) => s.entries.some((e) => e.exercise === S.chartExercise))
        .map((s) => {
          const sets = s.entries.filter((e) => e.exercise === S.chartExercise).flatMap((e) => e.sets);
          const top = Math.max(...sets.map((s2) => s2.weight), 0);
          return { label: shortDate(s.date), value: top };
        })
        .reverse()
    : [];
  const sortedNotes = [...S.notes].sort((a, b) => (a.date < b.date ? 1 : -1));
  const stats = S.consistency ? consistencyStats() : null;

  let html = "";
  if (stats && stats.closedWeeks.length > 0) {
    html += `<div style="margin-bottom:24px;">
      <div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Weekly consistency</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${[...stats.closedWeeks].reverse().map((w) => cardHtml(
          `<div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="color:var(--text);font-weight:700;">Week ${w.weekNumber}</span>
            <span style="color:var(--textMuted);font-size:13px;">${w.count}/${stats.target} sessions · ${w.met ? "hit target" : "missed"}</span>
          </div>`,
          { accent: w.met ? "var(--success)" : "var(--danger)" }
        )).join("")}
      </div>
    </div>`;
  }

  if (names.length > 0) {
    html += `<div style="margin-bottom:24px;">
      <div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Progress by exercise</div>
      <select id="chart-exercise-select" class="field" style="margin-bottom:12px;">
        <option value="">Select an exercise</option>
        ${names.map((n) => `<option value="${esc(n)}" ${S.chartExercise === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
      ${chartData.length > 1 ? cardHtml(lineChart(chartData, "var(--heavy)")) : ""}
      ${S.chartExercise && chartData.length <= 1 ? `<div style="color:var(--textFaint);font-size:13px;">Log this exercise on a couple more days to see a trend.</div>` : ""}
    </div>`;
  }

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Past sessions</div>`;
  if (sorted.length === 0) {
    html += `<div style="color:var(--textFaint);font-size:14px;margin-bottom:20px;">No sessions logged yet. Finish a workout and it'll show up here.</div>`;
  }
  html += `<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
    ${sorted.map((s) => {
      const expanded = S.expandedSession === s.id;
      const color = s.intensity === "heavy" ? "var(--heavy)" : "var(--light)";
      const setCount = s.entries.reduce((a, e) => a + e.sets.length, 0);
      let inner = `<div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:700;color:var(--text);">${DAY_LABEL[s.day]} · ${niceDate(s.date)}</div>
          <div style="font-size:12px;color:var(--textMuted);margin-top:2px;">${s.intensity === "heavy" ? "Heavy" : "Light"} · ${setCount === 0 ? "quick-logged" : `${setCount} sets`}${s.durationSeconds ? ` · ${formatElapsed(s.durationSeconds)}` : ""}</div>
        </div>
        ${s.prs && s.prs.length > 0 ? `<span style="background:var(--sun);color:var(--text);font-weight:800;font-size:11px;padding:3px 8px;border-radius:12px;">${s.prs.length} PR${s.prs.length > 1 ? "s" : ""}</span>` : ""}
      </div>`;
      if (expanded) {
        inner += `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
          ${s.note ? `<div style="font-size:13px;color:var(--textMuted);font-style:italic;padding-bottom:4px;">${esc(s.note)}</div>` : ""}
          ${s.prs && s.prs.length > 0 ? `<div style="font-size:12px;color:var(--text);font-weight:700;padding-bottom:4px;">PRs: ${esc(s.prs.map((pr) => `${pr.exercise} ${pr.weight}kg`).join(", "))}</div>` : ""}
          ${s.entries.map((e, i) => `<div style="border-top:1px solid var(--border);padding-top:8px;">
            <div style="font-size:13px;font-weight:700;color:var(--text);">${esc(e.exercise)}</div>
            <div style="font-size:12px;color:var(--textMuted);">${esc(e.sets.map((st2) => `${st2.weight}kg×${st2.reps}${st2.rpe ? ` @${st2.rpe}` : ""}`).join(", "))}</div>
          </div>`).join("")}
          ${s.reflection ? `<div style="border-top:1px solid var(--border);padding-top:8px;font-size:13px;color:var(--textMuted);font-style:italic;">"${esc(s.reflection)}"</div>` : ""}
        </div>`;
      }
      return cardHtml(inner, { accent: color, action: "toggleExpandSession", arg: s.id });
    }).join("")}
  </div>`;

  if (sortedNotes.length > 0) {
    html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Notes</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px;">
      ${sortedNotes.map((n) => cardHtml(`<div style="font-size:12px;color:var(--textFaint);margin-bottom:2px;">${niceDate(n.date)}</div><div style="font-size:14px;color:var(--text);">${esc(n.text)}</div>`)).join("")}
    </div>`;
  }

  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">Backup</div>
    <div style="font-size:12px;color:var(--textFaint);margin-bottom:10px;">Everything here already saves automatically as you use the app. Export a copy any time as a safety net, or restore from one.</div>
    ${S.importMessage ? `<div style="font-size:12px;color:var(--textMuted);margin-bottom:10px;">${esc(S.importMessage)}</div>` : ""}
    <div style="display:flex;gap:10px;">
      ${btnHtml("Export data", { variant: "outline", color: "var(--textMuted)", action: "exportData" })}
      ${btnHtml("Import data", { variant: "outline", color: "var(--textMuted)", action: "triggerImport" })}
    </div>
    <input id="import-file-input" type="file" accept="application/json" style="display:none">`;
  return html;
}

/* ================================================================ */
/* Screen: Body weight                                                */
/* ================================================================ */

function renderBodyweight() {
  const sorted = [...S.bodyweightLog].sort((a, b) => (a.date < b.date ? -1 : 1));
  const chartData = sorted.map((e) => ({ label: shortDate(e.date), value: e.weight }));
  const reversedForList = [...sorted].reverse();

  let html = `<div style="display:flex;gap:8px;margin-bottom:20px;">
    ${fieldHtml({ type: "number", bind: "bwInput", value: S.bwInput, placeholder: "Today's weight (kg)", extraStyle: "flex:1;" })}
    ${btnHtml("Log", { color: "var(--heavy)", action: "logBodyweight" })}
  </div>`;
  if (chartData.length > 1) {
    html += cardHtml(lineChart(chartData, "var(--light)"), { extraStyle: "margin-bottom:20px;" });
  }
  html += `<div style="color:var(--textMuted);font-size:13px;margin-bottom:8px;">History</div>`;
  if (reversedForList.length === 0) html += `<div style="color:var(--textFaint);font-size:14px;">No entries yet.</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:6px;">
    ${reversedForList.map((e) => `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:8px;padding:8px 12px;">
      <span style="color:var(--text);font-size:14px;">${niceDate(e.date)}</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:var(--text);font-weight:700;">${e.weight} kg</span>
        <button type="button" data-action="removeBodyweight" data-arg="${e.date}" style="background:none;border:none;cursor:pointer;">${icon("x", { size: 14, color: "var(--textFaint)" })}</button>
      </div>
    </div>`).join("")}
  </div>`;
  return html;
}

/* ================================================================ */
/* App shell: TopBar + BottomNav + top-level render()                 */
/* ================================================================ */

function topBarHtml(title, backAction) {
  return `<div class="topbar">
    <div class="topbar-left">
      ${backAction ? `<button type="button" class="back-btn" data-action="${esc(backAction)}">${icon("chevronLeft", { size: 22 })}</button>` : ""}
      <h1>${esc(title)}</h1>
    </div>
  </div>`;
}
function bottomNavHtml() {
  const items = [
    { id: "home", label: "Train", ic: "dumbbell" },
    { id: "history", label: "History", ic: "history" },
    { id: "bodyweight", label: "Body weight", ic: "scale" },
  ];
  return `<div class="bottom-nav">
    ${items.map((it) => {
      const active = S.view === it.id;
      return `<button type="button" class="nav-item" data-action="setView" data-arg="${it.id}" style="color:${active ? "var(--text)" : "var(--textFaint)"};">
        ${icon(it.ic, { size: 20, strokeWidth: active ? 2.4 : 1.8 })}
        <span style="font-size:11px;font-weight:${active ? 700 : 500};">${it.label}</span>
      </button>`;
    }).join("")}
  </div>`;
}

function render() {
  let body = "";
  let title = "Train";
  let backAction = null;

  if (S.view === "home") {
    body = renderHome(); title = "Train";
  } else if (S.view === "quickadd") {
    body = renderQuickAdd(); title = "Quick add"; backAction = "cancelQuickAdd";
  } else if (S.view === "session" && S.draft) {
    if (S.subView === "muscleList") {
      body = renderMuscleList(); title = DAY_LABEL[S.draft.day];
    } else if (S.subView === "exerciseList") {
      body = renderExerciseList();
      title = ((MUSCLE_CONFIG[S.draft.day].find((m) => m.key === S.activeMuscle)) || {}).name || "";
      backAction = "backToMuscleList";
    } else if (S.subView === "logging") {
      body = renderLogging(); title = "Log set"; backAction = "backToExerciseList";
    } else if (S.subView === "finish") {
      body = renderFinish(); title = "Workout complete"; backAction = "backToMuscleList";
    }
  } else if (S.view === "history") {
    body = renderHistory(); title = "History";
  } else if (S.view === "bodyweight") {
    body = renderBodyweight(); title = "Body weight";
  } else {
    S.view = "home"; body = renderHome(); title = "Train";
  }

  const showNav = S.view !== "session";
  document.getElementById("root").innerHTML =
    topBarHtml(title, backAction) +
    `<div class="screen">${body}</div>` +
    (showNav ? bottomNavHtml() : "");

  // keep the elapsed-time / rest-timer text ticking without a full re-render
  if (S.draft && isSessionRunning(S.draft)) armSessionTick(); else disarmSessionTick();
}

/* ================================================================ */
/* Action dispatch (click delegation)                                 */
/* ================================================================ */

const actions = {
  setView: (arg) => { S.view = arg; },
  resumeDraftView: () => { resumeDraftView(); },
  openQuickAdd: () => { resetQuickAdd(); S.view = "quickadd"; },
  cancelQuickAdd: () => { resetQuickAdd(); S.view = "home"; },
  saveQuickAdd: () => { saveQuickAdd(); },
  setQuickAddType: (arg) => { S.quickAddType = arg; },
  setQuickAddDay: (arg) => { S.quickAddDay = arg; },
  setQuickAddIntensity: (arg) => { S.quickAddIntensity = arg; },
  setPendingDay: (arg) => { S.pendingDay = arg; },
  setPendingIntensity: (arg) => { S.pendingIntensity = arg; },
  beginSession: () => { beginSession(); },
  consistencyStartEdit: () => { S.consistencyWeekInput = ""; S.consistencyTargetInput = "4"; S.consistencyEditing = true; },
  consistencyEditExisting: () => {
    const stats = consistencyStats();
    if (stats) { S.consistencyWeekInput = String(stats.currentWeekNumber); S.consistencyTargetInput = String(S.consistency.weeklyTarget); }
    S.consistencyEditing = true;
  },
  consistencyCancelEdit: () => { S.consistencyEditing = false; },
  saveConsistency: () => { saveConsistency(); },
  openMuscle: (arg) => { openMuscle(arg); },
  toggleSessionTimer: () => { isSessionRunning(S.draft) ? pauseSession() : resumeSession(); },
  discardDraft: () => { discardDraft(); },
  goToFinish: () => { goToFinish(); },
  backToMuscleList: () => { S.subView = "muscleList"; },
  backToExerciseList: () => { S.subView = "exerciseList"; },
  addExerciseEntry: (arg) => { addExerciseEntry(arg); },
  continueEntry: (arg) => { continueEntry(parseInt(arg, 10)); },
  addCustomExercise: () => { addCustomExercise(); },
  addSet: () => { addSet(); },
  removeSet: (arg) => { removeSet(parseInt(arg, 10)); },
  toggleRestTimer: () => { toggleRestTimer(); },
  adjustRestTimer: (arg) => { adjustRestTimer(parseInt(arg, 10)); },
  resetRestTimer: () => { resetRestTimer(); },
  doneWithExercise: () => { S.subView = "exerciseList"; },
  commitSession: () => { commitSession(); },
  toggleExpandSession: (arg) => { const id = parseInt(arg, 10); S.expandedSession = S.expandedSession === id ? null : id; },
  exportData: () => { exportData(); },
  triggerImport: () => { const el = document.getElementById("import-file-input"); if (el) el.click(); return "no-render"; },
  logBodyweight: () => { logBodyweight(); },
  removeBodyweight: (arg) => { removeBodyweight(arg); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const arg = el.dataset.arg;
  const fn = actions[action];
  if (!fn) return;
  const result = fn(arg, el);
  if (result !== "no-render") render();
});

/* ================================================================ */
/* Input / change delegation (state-bound fields — no re-render, so   */
/* focus and cursor position are never disturbed while typing)        */
/* ================================================================ */

function bindFromEvent(e) {
  const el = e.target;
  if (el && el.dataset && el.dataset.bind) {
    S[el.dataset.bind] = el.value;
  }
}
document.addEventListener("input", bindFromEvent);
document.addEventListener("change", (e) => {
  bindFromEvent(e);
  if (e.target && e.target.id === "chart-exercise-select") {
    S.chartExercise = e.target.value;
    render();
  }
  if (e.target && e.target.id === "import-file-input") {
    if (e.target.files && e.target.files[0]) importDataFile(e.target.files[0]);
  }
});

/* ================================================================ */
/* Init                                                                */
/* ================================================================ */

function init() {
  S.sessions = loadKey("sessions", []);
  S.customExercises = loadKey("custom-exercises", {});
  S.bodyweightLog = loadKey("bodyweight-log", []);
  S.notes = loadKey("notes", []);
  S.consistency = loadKey("consistency-settings", null);
  const d = loadKey("draft-session", null);
  if (d) S.draft = d;
  render();
}
init();

</script>
</body>
</html>
